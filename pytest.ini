[pytest]
# Тести лежать у tests/, а модулі — у корені. pythonpath робить корінь
# видимим для імпортів, тому тести пишуться як `import config`, без
# маніпуляцій з sys.path у кожному файлі.
pythonpath = .
testpaths = tests
asyncio_mode = auto
markers =
    needs_model: потребує завантаженої моделі ембедингів (мережа при першому запуску)
filterwarnings =
    ignore::DeprecationWarning
